name: Sync public screenshots
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/sync_screenshots.py
      - data/favorites.json
      - .github/workflows/update_screenshots.yml
permissions:
  contents: write
concurrency:
  group: public-steam-screenshot-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/sync_screenshots.py
      - run: python scripts/resolve_media.py
      - name: Commit archive
        run: |
          git config user.name 'HaKING Bot'
          git config user.email 'bot@haking.dev'
          git add data/screenshots.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update public screenshot archive"
          git pull --rebase
          git push
