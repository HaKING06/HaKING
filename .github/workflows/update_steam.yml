name: Update Steam Stats

on:
  push:
    paths:
      - update_stats.py
      - .github/workflows/update_steam.yml
  schedule:
    - cron: '*/30 * * * *' # Her 30 dakikada bir çalış
  workflow_dispatch: # İstediğin zaman elle çalıştırmak için

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Kütüphaneleri Yükle
        run: pip install requests

      - name: Scripti Çalıştır
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python update_stats.py

      - name: Değişiklikleri Kaydet
        run: |
          git config user.name 'HaKING Bot'
          git config user.email 'bot@haking.dev'
          git add data/steam_stats.json
          if git diff --cached --quiet; then
            echo "Steam verilerinde değişiklik yok."
            exit 0
          fi
          git commit -m "Steam kütüphanesi güncellendi"
          git push
